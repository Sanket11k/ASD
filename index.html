
<!DOCTYPE html>
<html>
<head>
    <title>My Docker Application</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #eaf2f8;
            padding-top: 100px;
        }

        .container {
            background: white;
            padding: 30px;
            margin: auto;
            width: 400px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hello Docker!</h1>
        <p>My first web application is running inside a Docker container.</p>
        <button onclick="alert('Docker is working!')">
            Click Me
        </button>
    </div>
</body>
</html>
